<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>교사용 · 정답 공개 관리</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><div class="wrap">
  <h1>교사용 · 정답 공개 관리</h1>
  <p>Ⅶ. 태양계 온라인 활동지</p>
</div></header>
<div class="wrap">
  <div class="card">
    <label for="tkey">교사 키</label>
    <input type="password" id="tkey" placeholder="Apps Script의 TEACHER_KEY 값">
    <p class="note">키는 이 기기의 현재 탭에서만 기억됩니다. 이 페이지 주소는 학생에게 공유하지 마세요.</p>
  </div>
  <div class="card">
    <h2>차시별 정답 공개 상태</h2>
    <div id="stBox"><p class="note">불러오는 중...</p></div>
  </div>
  <div id="msgBox" class="result"></div>
</div>
<script src="assets/config.js"></script>
<script>
const WS_NAMES = {ws1:"1차시 · 태양계 구성원", ws2:"2차시 · 행성의 특징", ws3:"3차시 · 태양의 표면과 대기", ws4:"4차시 · 태양 활동의 영향", ws5:"5차시 · 천체 관측"};
const keyEl = document.getElementById("tkey");
keyEl.value = sessionStorage.getItem("tkey") || "";
keyEl.addEventListener("input", () => sessionStorage.setItem("tkey", keyEl.value));

async function loadStatus() {
  const box = document.getElementById("stBox");
  try {
    const r = await fetch(SCRIPT_URL + "?action=status");
    const d = await r.json();
    if (!d.ok) throw 0;
    box.innerHTML = Object.keys(WS_NAMES).map(ws => {
      const open = !!d.status[ws];
      return `<div class="q" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div><b>${WS_NAMES[ws]}</b><br><span class="${open ? 'mark-ok' : 'mark-no'}">${open ? '공개 중' : '비공개'}</span></div>
        <button style="width:auto;padding:8px 14px" onclick="toggle('${ws}', ${open ? "'N'" : "'Y'"})">${open ? '비공개로 전환' : '정답 공개'}</button>
      </div>`;
    }).join("");
  } catch (e) {
    box.innerHTML = '<p class="note">상태를 불러올 수 없습니다. config.js의 서버 URL 설정을 확인하세요.</p>';
  }
}

async function toggle(ws, open) {
  const msg = document.getElementById("msgBox");
  const key = keyEl.value.trim();
  if (!key) { msg.className = "result err"; msg.textContent = "교사 키를 먼저 입력하세요."; return; }
  if (open === "Y" && !confirm(WS_NAMES[ws] + " 정답을 지금 공개할까요? 학생들이 즉시 볼 수 있게 됩니다.")) return;
  try {
    const r = await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({ action: "setOpen", key, ws, open }) });
    const d = await r.json();
    if (d.ok) { msg.className = "result ok"; msg.textContent = WS_NAMES[ws] + (d.open ? " 정답이 공개되었습니다." : " 정답이 비공개로 전환되었습니다."); }
    else { msg.className = "result err"; msg.textContent = d.message || "실패했습니다."; }
  } catch (e) { msg.className = "result err"; msg.textContent = "서버에 연결할 수 없습니다."; }
  loadStatus();
}
loadStatus();
</script>
</body>
</html>
